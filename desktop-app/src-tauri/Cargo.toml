[package]
name = "buitenzorg-player"
version = "0.1.0"
description = "Local-first desktop music player"
authors = ["Luthfie Abdul Hakim"]
repository = "https://github.com/fieeabdl-art/Buitenzorg-music-player"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "buitenzorg_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
lofty = "0.25.5"
keyring = { version = "3.6.2", default-features = false, features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.1"
getrandom = "0.3.4"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
